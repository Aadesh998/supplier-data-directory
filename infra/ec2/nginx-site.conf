# peoplvance.org: website (Next.js, 127.0.0.1:3100) and API (/api/*, 127.0.0.1:8090).
# Plain HTTP first; `sudo certbot --nginx -d peoplvance.org -d www.peoplvance.org` adds HTTPS + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name peoplvance.org www.peoplvance.org;

    access_log /var/log/nginx/peoplvance.org.access.log;
    error_log /var/log/nginx/peoplvance.org.error.log;

    # CSV imports go through the API.
    client_max_body_size 20M;

    # Overwrite (not append) X-Forwarded-For so a client can't spoof its IP; the API reads the last entry.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Browser API calls go straight to the Go API (skips Node).
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_read_timeout 60s;
    }
}
