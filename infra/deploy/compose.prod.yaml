# Production stack for a single small VPS (e.g. 2 vCPU / 4 GB).
#   cp infra/deploy/.env.production.example infra/deploy/.env   # fill in secrets
#   docker compose -f infra/deploy/compose.prod.yaml --env-file infra/deploy/.env up -d --build
# Only Caddy publishes ports. It terminates TLS and discards client-supplied X-Forwarded-*
# headers, which is what makes the API's per-IP rate limits trustworthy.
name: bharatmfg-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Using managed PostgreSQL instead? Delete this service and set DATABASE_URL in .env.

  api:
    build:
      context: ../..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      MIGRATE_ON_START: "true"
      HTTP_ADDR: ":8080"
      PUBLIC_SITE_URL: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:-2026-11-v1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      GOOGLE_PLACES_ENABLED: ${GOOGLE_PLACES_ENABLED:-false}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/web.Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      # Keep false until legal review is done and you are ready to be indexed.
      NEXT_PUBLIC_ALLOW_INDEXING: ${NEXT_PUBLIC_ALLOW_INDEXING:-false}
      NEXT_PUBLIC_PRIVACY_EMAIL: ${PRIVACY_EMAIL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
