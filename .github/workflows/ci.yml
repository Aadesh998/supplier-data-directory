name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bharatmfg
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: bharatmfg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bharatmfg" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://bharatmfg:ci-password@localhost:5432/bharatmfg_test?sslmode=disable
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l apps internal db packages)" || (gofmt -l apps internal db packages; exit 1)
      - name: vet
        run: go vet ./apps/api/... ./internal/... ./db/... ./packages/...
      - name: test (migrations, constraints, API, permissions)
        run: go test -race -count=1 ./apps/api/... ./internal/... ./db/... ./packages/...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/api ./apps/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build


  docker:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: docker compose build
