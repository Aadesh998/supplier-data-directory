name: bharatmfg

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bharatmfg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-bharatmfg}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local mail catcher: open http://localhost:8025 to read emails the API sends.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bharatmfg}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-bharatmfg}?sslmode=disable
      HTTP_ADDR: ":8080"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: "Bharat Manufacturing Directory <no-reply@localhost.test>"
      MIGRATE_ON_START: "true"
      # The API port is bound to localhost; only the web container (trusted proxy) reaches it.
      TRUST_PROXY_HEADERS: "true"
      PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: apps/web
      dockerfile: ../../infra/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_ALLOW_INDEXING: ${NEXT_PUBLIC_ALLOW_INDEXING:-false}
      NEXT_PUBLIC_PRIVACY_EMAIL: ${NEXT_PUBLIC_PRIVACY_EMAIL:-privacy@example.com}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
